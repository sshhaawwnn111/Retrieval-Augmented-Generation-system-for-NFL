version: '3.8'

services:
  llm-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vllm-service
    ports:
      - "8001:8001"
    environment:
      # Service Configuration
      - SERVICE_HOST=0.0.0.0
      - SERVICE_PORT=8001
      
      # Model Configuration
      - MODEL_NAME=meta-llama/Llama-2-7b-chat-hf
      - MODEL_REVISION=main
      - TENSOR_PARALLEL_SIZE=1
      - GPU_MEMORY_UTILIZATION=0.9
      - MAX_MODEL_LEN=4096
      
      # Generation Defaults
      - DEFAULT_MAX_TOKENS=512
      - DEFAULT_TEMPERATURE=0.7
      - DEFAULT_TOP_P=0.95
      
      # Service Settings
      - LOG_LEVEL=INFO
      - ENABLE_METRICS=true
      
      # Optional: HuggingFace Token (if using private models)
      # - HF_TOKEN=${HF_TOKEN}
    
    volumes:
      # Cache model downloads
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Mount application code for development
      - .:/app
    
    # GPU access - Requires nvidia-docker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Optional: Add a network for communication with backend
networks:
  default:
    name: ravensrotowire-network
    external: false
